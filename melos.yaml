# Task runner for the workspace. Resolution is handled by the native pub
# workspace in pubspec.yaml; melos here only orchestrates scripts.
name: warren_sdk_dart

packages:
  - packages/**

scripts:
  analyze:
    description: Static analysis across every package.
    run: dart analyze .
    exec:
      concurrency: 4

  format:
    description: Check formatting across every package.
    run: dart format --output=none --set-exit-if-changed .

  test:
    description: Run tests in packages that have them.
    run: dart test
    exec:
      concurrency: 2
      failFast: false
    packageFilters:
      dirExists: test

  gen:
    description: Run code generation (FRB, Riverpod, freezed) where configured.
    run: dart run build_runner build --delete-conflicting-outputs
    exec:
      failFast: true
    packageFilters:
      dependsOn: build_runner
