[package]
name = "warren_sdk_frb"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "flutter_rust_bridge glue exposing the Warren engine to Dart/Flutter (Mode A, in-process)."
publish = false

[lib]
# cdylib for Android/iOS/desktop dynamic loading; staticlib for iOS/macOS static
# linking. The Flutter FFI plugin (warren_sdk_ffi) builds this via cargokit.
crate-type = ["cdylib", "staticlib"]

[dependencies]
# The audited Warren engine, reused not reimplemented. Pinned by tag for
# reproducible builds on every machine and in CI (no assumption about repo
# layout on disk). To bump the engine, move this tag and re-run codegen.
# For local co-development against a working copy of the engine, use the
# documented gitignored path override (see the repo README, "Local co-development")
# so this pin stays the single source of truth for CI and releases.
warren-sdk = { git = "https://github.com/WarrenBrowse/warren-sdk-rs.git", rev = "762f114a83e7e5303b280cd26e293d05ffaf1df7" }

flutter_rust_bridge = "=2.12.0"
anyhow = "1"
hex = "0.4"
# Wipe the bridge-side mnemonic copy after the engine has derived from it.
zeroize = "1"
# `sync` names the engine's `watch::Receiver<ConnectionState>` in the session
# handle; `net`/`time` back the in-tunnel egress liveness probe (doc 62
# item 5), which runs on the runtime flutter_rust_bridge owns (none is
# created here).
tokio = { version = "1", features = ["sync", "net", "time", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "net", "time", "rt", "rt-multi-thread", "macros"] }

# `frb_expand` is set by flutter_rust_bridge_codegen during its cargo-expand pass
# to exclude the generated module; register it so it is not an unexpected cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The engine's warren-contract carve-out (v0.0.14) declares `warrenguard-wire` as a
# path dep relative to its own repo (`../warrenguard/...`), which escapes the git
# checkout and cannot resolve from git alone. Repoint warren-contract at the sibling
# and pin warrenguard-wire to that same sibling so the whole graph shares one copy.
# This makes the crate require the `../../../warrenguard` and `../../../warren-contract`
# siblings (as warren-core/warren-app already do); CI clones them before building.
[patch."https://github.com/WarrenBrowse/warren-contract.git"]
warren-contract = { path = "../../../warren-contract" }
warren-discovery-core = { path = "../../../warren-contract/warren-discovery" }

# The engine repos declare the warren-quinn fork over ssh://, which requires an
# SSH key even for a read-only build. Repoint that git-dep at the https:// form
# of the same repo and tag (identical commit, only the transport changes) so a
# checkout builds with plain https read access.
[patch."ssh://git@github.com/WarrenBrowse/warren-quinn.git"]
warren-quinn = { git = "https://github.com/WarrenBrowse/warren-quinn.git", tag = "v0.11.16-fork.11" }
warren-quinn-udp = { git = "https://github.com/WarrenBrowse/warren-quinn.git", tag = "v0.11.16-fork.11" }

[patch."https://github.com/WarrenBrowse/warrenguard.git"]
warrenguard-backoff = { path = "../../../warrenguard/crates/warrenguard-backoff" }
warrenguard-wire = { path = "../../../warrenguard/crates/warrenguard-wire" }
warrenguard-identity = { path = "../../../warrenguard/crates/warrenguard-identity" }
warrenguard-multihop = { path = "../../../warrenguard/crates/warrenguard-multihop" }
warrenguard-daita = { path = "../../../warrenguard/crates/warrenguard-daita" }
warrenguard-tls = { path = "../../../warrenguard/crates/warrenguard-tls" }
warrenguard-transport = { path = "../../../warrenguard/crates/warrenguard-transport" }
warrenguard-transport-core = { path = "../../../warrenguard/crates/warrenguard-transport-core" }
warrenguard-natpmp-protocol = { path = "../../../warrenguard/crates/warrenguard-natpmp-protocol" }
warrenguard-tun-core = { path = "../../../warrenguard/crates/warrenguard-tun-core" }
warrenguard-tun-device = { path = "../../../warrenguard/crates/warrenguard-tun-device" }
