[package]
name = "warrend"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Warren SDK desktop system-VPN daemon (Mode B): owns the TUN datapath and serves the SDK IPC protocol over a Unix socket."
publish = false

[[bin]]
name = "warrend"
path = "src/main.rs"

[dependencies]
# Same audited engine as the in-process SDK, with the privileged TUN datapath.
# Pinned by rev to carry the socket-marked control-plane transport: the
# `marked-transport` feature tags warrend's control-plane HTTP client with the
# Warren tunnel fwmark, so the tightened `meta mark` connecting guard permits it.
warren-sdk = { git = "https://github.com/WarrenBrowse/warren-sdk-rs.git", rev = "8a0618d49e94b10841551dd03bd3b680bc4101b8", features = [
    "experimental-tun",
    "marked-transport",
] }
# Builds the engine's obfuscated QUIC-Initial transport config injected into the
# SDK (system-VPN anti-DPI parity with warren-app). The fork-only quinn API is
# available transitively: warren-sdk and warrenguard both depend on the
# warren-quinn fork, so no `[patch.crates-io]` is needed here.
warrenguard-transport-core = { path = "../../../warrenguard/crates/warrenguard-transport-core" }
# Canonical firewall artifact names (nft table, pf anchor) and the in-tunnel
# DNS gateway, shared with the engine so warrend's crash-recovery paths can
# never drift from what the engine actually installs.
warrenguard-killswitch-os = { path = "../../../warrenguard/crates/warrenguard-killswitch-os" }
warrenguard-config = { path = "../../../warrenguard/crates/warrenguard-config" }
warrenguard-route-split = { path = "../../../warrenguard/crates/warrenguard-route-split" }
# The connecting guard permits the daemon's OWN marked sockets by fwmark; the
# canonical WARREN_TUNNEL_FWMARK lives here (same const the carrier tags with),
# so the guard rule and the socket mark can never drift.
warrenguard-tun-core = { path = "../../../warrenguard/crates/warrenguard-tun-core" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
# Peer-credential check on the control socket (getpeereid / SO_PEERCRED).
libc = "0.2"
# Wipe the mnemonic and the raw request frame from the daemon's memory after use.
zeroize = "1"

# The SDK declares the engine crates as git deps; this daemon has warrenguard as a
# sibling, so resolve them (and their transitive engine deps, via the sibling's own
# internal path-deps) from the local checkout. Keep in lockstep with the SDK's git
# deps. Without a sibling, drop this block and cargo fetches the pinned git rev.
# The engine repos declare the warren-quinn fork over ssh://, which requires an
# SSH key even for a read-only build. Repoint that git-dep at the https:// form
# of the same repo and tag (identical commit, only the transport changes) so a
# checkout builds with plain https read access.
[patch."ssh://git@github.com/WarrenBrowse/warren-quinn.git"]
warren-quinn = { git = "https://github.com/WarrenBrowse/warren-quinn.git", tag = "v0.11.16-fork.11" }
warren-quinn-udp = { git = "https://github.com/WarrenBrowse/warren-quinn.git", tag = "v0.11.16-fork.11" }

[patch."https://github.com/WarrenBrowse/warrenguard.git"]
warrenguard-backoff = { path = "../../../warrenguard/crates/warrenguard-backoff" }
warrenguard-wire = { path = "../../../warrenguard/crates/warrenguard-wire" }
warrenguard-identity = { path = "../../../warrenguard/crates/warrenguard-identity" }
warrenguard-multihop = { path = "../../../warrenguard/crates/warrenguard-multihop" }
warrenguard-daita = { path = "../../../warrenguard/crates/warrenguard-daita" }
warrenguard-tls = { path = "../../../warrenguard/crates/warrenguard-tls" }
warrenguard-transport = { path = "../../../warrenguard/crates/warrenguard-transport" }
warrenguard-transport-core = { path = "../../../warrenguard/crates/warrenguard-transport-core" }
warrenguard-natpmp-protocol = { path = "../../../warrenguard/crates/warrenguard-natpmp-protocol" }
warrenguard-tun-core = { path = "../../../warrenguard/crates/warrenguard-tun-core" }
warrenguard-tun-device = { path = "../../../warrenguard/crates/warrenguard-tun-device" }
warrenguard-socket-bypass = { path = "../../../warrenguard/crates/warrenguard-socket-bypass" }
warrenguard-tcp-fallback = { path = "../../../warrenguard/crates/warrenguard-tcp-fallback" }
warrenguard-token = { path = "../../../warrenguard/crates/warrenguard-token" }
warrenguard-config = { path = "../../../warrenguard/crates/warrenguard-config" }
warrenguard-route-split = { path = "../../../warrenguard/crates/warrenguard-route-split" }
warrenguard-killswitch-os = { path = "../../../warrenguard/crates/warrenguard-killswitch-os" }
warrenguard-pump = { path = "../../../warrenguard/crates/warrenguard-pump" }

# The engine's warren-contract carve-out declares `warrenguard-wire` as a path dep
# relative to its own repo (`../warrenguard/...`), which escapes the git checkout
# and cannot resolve from git alone. Repoint warren-contract at the sibling so its
# path dep lands on the same local warrenguard the block above already patches.
[patch."https://github.com/WarrenBrowse/warren-contract.git"]
warren-contract = { path = "../../../warren-contract" }
warren-discovery-core = { path = "../../../warren-contract/warren-discovery" }

[profile.release]
opt-level = 3
lto = "thin"
# Fail closed on a panic: no unwinding means no RAII teardown runs, so the
# installed kill-switch rules keep holding instead of restoring the network
# at the exact moment the daemon is in an undefined state. Matches the
# engine's own release posture (see warrenguard-killswitch-os crate docs).
panic = "abort"
strip = true
