# Strict, shared analysis for the whole workspace. Individual packages may include
# this file. Keep it aligned with the engineering conventions in CLAUDE.md.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A redacted-only no-log discipline: forbid leaving debug prints in code.
    avoid_print: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    # flutter_rust_bridge output; regenerated by `melos run gen`, never edited.
    - "**/src/rust/**"
    - "native/**/target/**"
    # Vendored cargokit toolkit (its own mini-package); it builds the native
    # engine during `flutter build`, it is not SDK code.
    - "**/cargokit/**"

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_in_for_each
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - prefer_relative_imports
    # Every public member must carry a `///` doc; the workspace ships this way and
    # the rule keeps it that way (flutter_lints does not enable it on its own).
    - public_member_api_docs
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - use_super_parameters
