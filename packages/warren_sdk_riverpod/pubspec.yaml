name: warren_sdk_riverpod
description: >-
  Optional Riverpod 3 integration for the Warren VPN SDK. Provides ready-made
  providers for the client, subscription, exits and live connection state. Never
  required: the core warren_sdk facade is framework-agnostic.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  warren_sdk:
    path: ../warren_sdk

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
