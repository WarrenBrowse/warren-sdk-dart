name: warren_sdk_example
description: >-
  Example app exercising every feature of the Warren VPN Dart SDK: identity
  helpers, client and account, exit discovery, proxy and system-VPN
  connections, the live connection-state stream and the sealed error surface.
  Wires the optional Riverpod 3 integration.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  # Riverpod 3 (modern Notifier/AsyncNotifier + codegen).
  flutter_riverpod: ^3.0.0
  # Secure store for the 12-word mnemonic (Keychain / Keystore / libsecret /
  # DPAPI). The seed is read here, handed once to the engine, never logged.
  flutter_secure_storage: ^9.2.2
  riverpod_annotation: ^3.0.0
  # The SDK facade (framework-agnostic).
  warren_sdk:
    path: ../
  # Mode B (system VPN) on desktop: drives the privileged warrend daemon.
  warren_sdk_desktop:
    path: ../../warren_sdk_desktop
  # The optional Riverpod 3 integration for the SDK.
  warren_sdk_riverpod:
    path: ../../warren_sdk_riverpod

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.8.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  # Drives the real bundled engine on a device/desktop to prove it loads.
  integration_test:
    sdk: flutter
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0

flutter:
  uses-material-design: true
