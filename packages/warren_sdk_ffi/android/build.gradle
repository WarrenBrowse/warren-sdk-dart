// Android native build for the Warren in-process engine. cargokit cross-compiles
// `native/warren_sdk_frb` per ABI via the NDK and bundles the .so. See
// NATIVE_BUILD.md.

group 'com.warrenbrowse.warren_sdk_ffi'
version '0.1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.warrenbrowse.warren_sdk_ffi'
    }

    compileSdkVersion 33

    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../../native/warren_sdk_frb"
    libname = "warren_sdk_frb"
}
