name: warren_sdk_ffi
description: >-
  In-process implementation of the Warren SDK platform interface (Mode A). Runs
  the Warren Rust engine inside the Flutter app process via flutter_rust_bridge
  and exposes a local SOCKS5 / HTTP proxy. The default, non-privileged engine.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  meta: ^1.15.0
  warren_sdk_platform_interface:
    path: ../warren_sdk_platform_interface

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    # An FFI plugin: native code is loaded directly, no method channels. The
    # Rust engine is built from source by cargokit (see ADR-007).
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
