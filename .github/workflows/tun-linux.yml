name: Linux TUN (rooted, netns)

# EXPERIMENTAL, manual-only (workflow_dispatch). Deliberately NOT in the push/PR
# gate: it needs root, a real exit, and a subscribed WARREN_MNEMONIC repo secret,
# and the Linux TUN datapath is not yet live-validated (unlike macOS). It runs the
# `warrend` daemon inside a Linux network namespace so its split-default route and
# nft killswitch stay confined to the namespace and never touch the runner's host
# routing (see scripts/ci-netns-linux-tun.sh). The script's phase 1 (kill-switch
# fail-closed persistence + the revert/reconcile recovery paths, real nft + real
# egress) is mnemonic-free and runs on every dispatch; without WARREN_MNEMONIC
# only the live TUN test self-skips, so a dry run is still green AND meaningful.
#
# Runs on the org self-hosted Linux runner; needs root + ip/iptables/nft on it.

on:
  workflow_dispatch: {}

jobs:
  netns-tun:
    name: rooted system-VPN TUN in a netns
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          # Repo-level PAT: see ci.yml for why the org secret does not resolve.
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      - name: authenticate cargo for the private engine dependency
        run: git config --global url."https://x-access-token:${{ secrets.VECTORS_TOKEN }}@github.com/".insteadOf "https://github.com/" && git config --global url."https://x-access-token:${{ secrets.VECTORS_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - run: flutter pub get
      - name: checkout the engine siblings (warrenguard + warren-contract)
        # Both warren_sdk_frb and warrend build against the engine's warrenguard
        # crates and the warren-contract carve-out, patched to these siblings;
        # warrend also injects warrenguard's obfuscated transport config. Pinned to
        # the revs the pinned engine tag (v0.0.24) records in its
        # .warrenguard-version / .warren-contract-version marker files.
        run: |
          set -euo pipefail
          rm -rf ../warrenguard ../warren-contract
          git clone --quiet \
            "https://x-access-token:${{ secrets.VECTORS_TOKEN }}@github.com/WarrenBrowse/warrenguard.git" \
            ../warrenguard
          git -C ../warrenguard checkout --quiet f47abedb3008a9608f3b6e2a63a5503bd9727150
          git clone --quiet \
            "https://x-access-token:${{ secrets.VECTORS_TOKEN }}@github.com/WarrenBrowse/warren-contract.git" \
            ../warren-contract
          git -C ../warren-contract checkout --quiet 1c8f733689dbfd092f56591a4d16e0b287823526
      - name: build the in-process engine dylib (discovery)
        run: cargo build --release
        working-directory: native/warren_sdk_frb
      - name: build the privileged daemon
        run: cargo build --release
        working-directory: native/warrend
      - name: run the rooted TUN test inside a network namespace
        env:
          FLUTTER: flutter
          WARREN_ROOTED: "1"
          WARREN_MNEMONIC: ${{ secrets.WARREN_MNEMONIC }}
          WARREN_API_BASE: https://api.warrenbrowse.com
          WARREN_SERVER_PIN: 4c2c9253c426ae4db4cc88703f9ac802a020420c7fea6479c87af530ada72c3e
        run: sudo -E env "PATH=$PATH" "FLUTTER=$FLUTTER" bash scripts/ci-netns-linux-tun.sh
