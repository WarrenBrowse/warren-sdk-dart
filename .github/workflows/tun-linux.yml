name: Linux TUN (rooted, netns)

# EXPERIMENTAL, manual-only (workflow_dispatch). Deliberately NOT in the push/PR
# gate: its live half needs a real exit and a subscribed WARREN_MNEMONIC repo
# secret, and the Linux TUN datapath is not yet live-validated (unlike macOS). It
# runs the `warrend` daemon inside a Linux network namespace so its split-default
# route and nft killswitch stay confined to the namespace and never touch the
# runner's host routing (see scripts/ci-netns-linux-tun.sh). The script's phase 1
# (kill-switch fail-closed persistence + the revert/reconcile recovery paths, real
# nft + real egress) is mnemonic-free and runs on every dispatch; without
# WARREN_MNEMONIC only the live TUN test self-skips, so a dry run is still green
# AND meaningful.
#
# Runs on a GitHub-hosted runner (ubuntu-24.04, pinned): a throwaway VM with
# passwordless sudo, a real kernel and /dev/net/tun, so creating the netns and
# loading the nft killswitch needs no capability grant on a shared fleet.

on:
  workflow_dispatch: {}

jobs:
  netns-tun:
    name: rooted system-VPN TUN in a netns
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Repo-level PAT: see ci.yml (org secrets do not resolve in runs).
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      - name: nft for the killswitch
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nftables
      # Both warren_sdk_frb and warrend build against the engine's warrenguard
      # crates and the warren-contract carve-out, patched to siblings checked out
      # at the revs the pinned engine names (the same action ci.yml uses).
      - uses: ./.github/actions/setup-engine-build
        with:
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/warren_sdk_frb
            native/warrend
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: flutter pub get
      - name: build the in-process engine dylib (discovery)
        run: cargo build --release
        working-directory: native/warren_sdk_frb
      - name: build the privileged daemon
        run: cargo build --release
        working-directory: native/warrend
      - name: run the rooted TUN test inside a network namespace
        env:
          FLUTTER: flutter
          WARREN_ROOTED: "1"
          WARREN_MNEMONIC: ${{ secrets.WARREN_MNEMONIC }}
          WARREN_API_BASE: https://api.warrenbrowse.com
          WARREN_SERVER_PIN: 4c2c9253c426ae4db4cc88703f9ac802a020420c7fea6479c87af530ada72c3e
        run: sudo -E env "PATH=$PATH" "FLUTTER=$FLUTTER" bash scripts/ci-netns-linux-tun.sh
