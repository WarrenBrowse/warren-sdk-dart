name: CI

# Runs on the WarrenBrowse org self-hosted runners (same as warren-sdk-rs and
# warren-app), so it never consumes GitHub-hosted minutes. Label set:
#   [self-hosted, Linux, X64]  -> macstudio-linux-rosetta / warren-docker-ci
# Do not switch any job to a GitHub-hosted runner (the org's hosted-minutes
# billing is disabled, so those jobs never start).
#
# VECTORS_TOKEN must be a REPO-LEVEL secret (gh secret set ... --repo ...), not the
# org-level one: while the org billing is degraded, org secrets do not resolve in
# runs (checkout fails with "Input required and not supplied: token"). It is a PAT
# with read access to the private warren-sdk-rs (cargo git dep) + warren-vectors
# (submodule).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  analyze:
    name: format + analyze
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      - run: flutter pub get
      - name: format
        run: dart format --output=none --set-exit-if-changed .
      - name: analyze
        run: flutter analyze

  test-pure:
    name: unit tests (no engine)
    runs-on: [self-hosted, Linux, X64]
    steps:
      # These packages fake the platform and never load the native engine.
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      - run: flutter pub get
      # The Riverpod providers are code-generated; the committed *.g.dart must not
      # drift from the annotated source.
      - name: riverpod codegen is up to date
        working-directory: packages/warren_sdk_riverpod
        run: |
          set -euo pipefail
          dart run build_runner build
          git diff --exit-code
      - run: flutter test
        working-directory: packages/warren_sdk_ffi
      - run: flutter test
        working-directory: packages/warren_sdk_desktop
      - run: flutter test
        working-directory: packages/warren_sdk_mobile
      - run: flutter test
        working-directory: packages/warren_sdk_riverpod

  conformance:
    name: golden-vector conformance (real engine)
    runs-on: [self-hosted, Linux, X64]
    steps:
      # Needs the shared vectors submodule and read access to the private engine
      # for the cargo git dependency. VECTORS_TOKEN must be a PAT with read access
      # to BOTH warren-vectors and warren-sdk-rs.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      - name: authenticate cargo for the private engine dependency
        run: git config --global url."https://x-access-token:${{ secrets.VECTORS_TOKEN }}@github.com/".insteadOf "https://github.com/" && git config --global url."https://x-access-token:${{ secrets.VECTORS_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - run: flutter pub get
      - name: checkout the engine siblings (warrenguard + warren-contract)
        # v0.0.14's warren-contract carve-out declares warrenguard-wire as a repo-
        # relative path dep, so native/warren_sdk_frb now patches warren-contract and
        # warrenguard to these siblings. Clone them at the SDK's pinned revs before
        # building (warrenguard: .warrenguard-expected-rev; warren-contract: the
        # engine's warren-contract rev at tag v0.0.14).
        run: |
          set -euo pipefail
          rm -rf ../warrenguard ../warren-contract
          git clone --quiet "https://x-access-token:${{ secrets.VECTORS_TOKEN }}@github.com/WarrenBrowse/warrenguard.git" ../warrenguard
          git -C ../warrenguard checkout --quiet 906ddc75a7a33a17ef744cf0b486e6ed4bc4ff4e
          git clone --quiet "https://x-access-token:${{ secrets.VECTORS_TOKEN }}@github.com/WarrenBrowse/warren-contract.git" ../warren-contract
          git -C ../warren-contract checkout --quiet 19b6a1c1aa3805211101daaa009ea9d3877cca20
      - name: build the native engine
        run: cargo build --release
        working-directory: native/warren_sdk_frb
      - name: replay golden vectors through the Dart facade
        run: flutter test
        working-directory: packages/warren_sdk

  codegen-drift:
    name: flutter_rust_bridge codegen is up to date
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.VECTORS_TOKEN }}
      # rustfmt: FRB codegen formats the generated file (an unformatted file
      # would otherwise drift from the committed, formatted one). cargo-expand:
      # codegen runs `cargo expand` for the macro-expansion pass.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: install cargo-expand
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      - run: git config --global url."https://x-access-token:${{ secrets.VECTORS_TOKEN }}@github.com/".insteadOf "https://github.com/" && git config --global url."https://x-access-token:${{ secrets.VECTORS_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - run: flutter pub get
      - run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - name: checkout the engine siblings (warrenguard + warren-contract)
        # Codegen macro-expands native/warren_sdk_frb, which since v0.0.14 patches
        # warren-contract + warrenguard to local siblings (see the conformance job).
        run: |
          set -euo pipefail
          rm -rf ../warrenguard ../warren-contract
          git clone --quiet "https://x-access-token:${{ secrets.VECTORS_TOKEN }}@github.com/WarrenBrowse/warrenguard.git" ../warrenguard
          git -C ../warrenguard checkout --quiet 906ddc75a7a33a17ef744cf0b486e6ed4bc4ff4e
          git clone --quiet "https://x-access-token:${{ secrets.VECTORS_TOKEN }}@github.com/WarrenBrowse/warren-contract.git" ../warren-contract
          git -C ../warren-contract checkout --quiet 19b6a1c1aa3805211101daaa009ea9d3877cca20
      - run: flutter_rust_bridge_codegen generate
      - name: fail if generated bindings drift from the committed ones
        run: git diff --exit-code
