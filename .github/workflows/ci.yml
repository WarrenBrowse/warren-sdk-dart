name: CI

# Runs on GitHub-hosted runners (ubuntu-24.04, pinned), free for a public
# repository. Flutter has no Linux arm64 SDK, so every job stays on x86_64.
# The Rust jobs restore a cargo cache that only main's runs save.
#
# VECTORS_TOKEN must be a REPO-LEVEL secret (gh secret set ... --repo ...), not
# an org-level one: org secrets do not resolve in this org's runs (checkout
# fails with "Input required and not supplied: token"). It is a PAT with read
# access to warren-sdk-rs (cargo git dep) + warren-vectors (submodule).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  analyze:
    # Only same-repo events reach this job: a fork's run gets no repository
    # secret, and the engine jobs cannot build without VECTORS_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: format + analyze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      - run: flutter pub get
      - name: format
        run: dart format --output=none --set-exit-if-changed .
      - name: analyze
        run: flutter analyze

  test-pure:
    # Only same-repo events reach this job: a fork's run gets no repository
    # secret, and the engine jobs cannot build without VECTORS_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: unit tests (no engine)
    runs-on: ubuntu-24.04
    steps:
      # These packages fake the platform and never load the native engine.
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      - run: flutter pub get
      # The Riverpod providers are code-generated; the committed *.g.dart must not
      # drift from the annotated source.
      - name: riverpod codegen is up to date
        working-directory: packages/warren_sdk_riverpod
        run: |
          set -euo pipefail
          dart run build_runner build
          # Scope the drift check to this package: the Dart codegen writes
          # nowhere else, and the `vectors` submodule (not checked out here)
          # is no concern of this gate.
          git diff --exit-code -- .
      - run: flutter test
        working-directory: packages/warren_sdk_platform_interface
      - run: flutter test
        working-directory: packages/warren_sdk_ffi
      - run: flutter test
        working-directory: packages/warren_sdk_desktop
      - run: flutter test
        working-directory: packages/warren_sdk_mobile
      - run: flutter test
        working-directory: packages/warren_sdk_riverpod

  conformance:
    # Only same-repo events reach this job: a fork's run gets no repository
    # secret, and the engine jobs cannot build without VECTORS_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: golden-vector conformance (real engine)
    runs-on: ubuntu-24.04
    steps:
      # Needs the shared vectors submodule and read access to the private engine
      # for the cargo git dependency. VECTORS_TOKEN must be a PAT with read access
      # to BOTH warren-vectors and warren-sdk-rs.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      # Authorize cargo for the private git-deps and clone warrenguard +
      # warren-contract siblings at the revs the pinned engine tag expects
      # (derived from the tag, never hardcoded). See the composite action.
      - uses: ./.github/actions/setup-engine-build
        with:
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/warren_sdk_frb
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: flutter pub get
      - name: build the native engine
        # --locked: the build must use the committed Cargo.lock exactly, never
        # silently update it. This is the reproducibility guard AND the signal that
        # a resync is due: bumping the engine tag changes the resolved graph, so if
        # the committed lock was not resynced this fails fast with "the lock file
        # needs to be updated but --locked was passed" (fix: see the README's
        # "Bumping the engine" steps).
        run: cargo build --release --locked
        working-directory: native/warren_sdk_frb
      - name: replay golden vectors through the Dart facade
        run: flutter test
        working-directory: packages/warren_sdk

  warrend:
    # Only same-repo events reach this job: a fork's run gets no repository
    # secret, and the engine jobs cannot build without VECTORS_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: warrend daemon tests
    runs-on: ubuntu-24.04
    steps:
      # The daemon's unit tests plus the tests that launch the real binary
      # unprivileged: its launch environment, its control socket's mode and
      # directory, and what it refuses to remove. None needs root or a network.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      # warrend pins the same warren-sdk rev as native/warren_sdk_frb and
      # patches the same siblings, so the frb-derived sibling revs apply.
      - uses: ./.github/actions/setup-engine-build
        with:
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/warrend
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked
        working-directory: native/warrend

  codegen-drift:
    # Only same-repo events reach this job: a fork's run gets no repository
    # secret, and the engine jobs cannot build without VECTORS_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: flutter_rust_bridge codegen is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.VECTORS_TOKEN }}
      # rustfmt: FRB codegen formats the generated file (an unformatted file
      # would otherwise drift from the committed, formatted one). cargo-expand:
      # codegen runs `cargo expand` for the macro-expansion pass.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: install cargo-expand
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      # Codegen macro-expands native/warren_sdk_frb (a `cargo expand` pass that
      # fetches warren-sdk-rs and [patch]es warrenguard + warren-contract to
      # siblings), so it needs the same cargo auth + engine-pinned siblings as the
      # conformance job.
      - uses: ./.github/actions/setup-engine-build
        with:
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/warren_sdk_frb
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: flutter pub get
      - run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - run: flutter_rust_bridge_codegen generate
      - name: fail if generated bindings drift from the committed ones
        # Exclude the `vectors` submodule: it is never an FRB codegen output
        # (this job checks out without submodules).
        run: git diff --exit-code -- . ':(exclude)vectors'
