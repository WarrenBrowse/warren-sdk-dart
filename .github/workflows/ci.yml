name: CI

# Runs on the WarrenBrowse org self-hosted runners (same as warren-sdk-rs and
# warren-app), so it never consumes GitHub-hosted minutes. Label set:
#   [self-hosted, Linux, X64, macstudio-rosetta]  -> the warren-linux-runner
#   x86 Rosetta pool. Flutter has no Linux arm64 SDK, so these jobs cannot use
#   the native arm64 pool the pure-Rust repos migrated to; they stay on x86.
#   The macstudio-rosetta label is deliberately NARROWER than a bare
#   [self-hosted, Linux, X64] (which also lands on the warren-docker-mac pool):
#   only the warren-linux-runner containers ship the clang-lld linker below.
# Do not switch any job to a GitHub-hosted runner (the org's hosted-minutes
# billing is disabled, so those jobs never start).
#
# VECTORS_TOKEN must be a REPO-LEVEL secret (gh secret set ... --repo ...), not the
# org-level one: while the org billing is degraded, org secrets do not resolve in
# runs (checkout fails with "Input required and not supplied: token"). It is a PAT
# with read access to the private warren-sdk-rs (cargo git dep) + warren-vectors
# (submodule).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  # Rosetta-emulated x86: gcc's collect2 link driver segfaults under memory
  # pressure on large proc-macro/build-script links (the 2026-07-18
  # zerovec-derive red). clang-lld drives the link without collect2. Baked into
  # the warren-linux-runner image (the macstudio-rosetta pool the jobs pin), and
  # target scoped so it is inert on the flutter-only steps.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang-lld

jobs:
  analyze:
    name: format + analyze
    runs-on: [self-hosted, Linux, X64, macstudio-rosetta]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      - run: flutter pub get
      - name: format
        run: dart format --output=none --set-exit-if-changed .
      - name: analyze
        run: flutter analyze

  test-pure:
    name: unit tests (no engine)
    runs-on: [self-hosted, Linux, X64, macstudio-rosetta]
    steps:
      # These packages fake the platform and never load the native engine.
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      - run: flutter pub get
      # The Riverpod providers are code-generated; the committed *.g.dart must not
      # drift from the annotated source.
      - name: riverpod codegen is up to date
        working-directory: packages/warren_sdk_riverpod
        run: |
          set -euo pipefail
          dart run build_runner build
          # Scope the drift check to this package: a repo-wide `git diff` also
          # trips on the `vectors` submodule, which the persistent self-hosted
          # runner leaves at a prior commit (this job checks out without
          # submodules, so its gitlink and the stale working tree disagree).
          git diff --exit-code -- .
      - run: flutter test
        working-directory: packages/warren_sdk_platform_interface
      - run: flutter test
        working-directory: packages/warren_sdk_ffi
      - run: flutter test
        working-directory: packages/warren_sdk_desktop
      - run: flutter test
        working-directory: packages/warren_sdk_mobile
      - run: flutter test
        working-directory: packages/warren_sdk_riverpod

  conformance:
    name: golden-vector conformance (real engine)
    runs-on: [self-hosted, Linux, X64, macstudio-rosetta]
    steps:
      # Needs the shared vectors submodule and read access to the private engine
      # for the cargo git dependency. VECTORS_TOKEN must be a PAT with read access
      # to BOTH warren-vectors and warren-sdk-rs.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      # Authorize cargo for the private git-deps and clone warrenguard +
      # warren-contract siblings at the revs the pinned engine tag expects
      # (derived from the tag, never hardcoded). See the composite action.
      - uses: ./.github/actions/setup-engine-build
        with:
          token: ${{ secrets.VECTORS_TOKEN }}
      - run: flutter pub get
      - name: build the native engine
        # --locked: the build must use the committed Cargo.lock exactly, never
        # silently update it. This is the reproducibility guard AND the signal that
        # a resync is due: bumping the engine tag changes the resolved graph, so if
        # the committed lock was not resynced this fails fast with "the lock file
        # needs to be updated but --locked was passed" (fix: see the README's
        # "Bumping the engine" steps).
        run: cargo build --release --locked
        working-directory: native/warren_sdk_frb
      - name: replay golden vectors through the Dart facade
        run: flutter test
        working-directory: packages/warren_sdk

  codegen-drift:
    name: flutter_rust_bridge codegen is up to date
    runs-on: [self-hosted, Linux, X64, macstudio-rosetta]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.VECTORS_TOKEN }}
      # rustfmt: FRB codegen formats the generated file (an unformatted file
      # would otherwise drift from the committed, formatted one). cargo-expand:
      # codegen runs `cargo expand` for the macro-expansion pass.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: install cargo-expand
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the fvm-pinned version (.fvmrc) for reproducible CI.
          flutter-version: 3.44.2
          channel: stable
      # Codegen macro-expands native/warren_sdk_frb (a `cargo expand` pass that
      # fetches warren-sdk-rs and [patch]es warrenguard + warren-contract to
      # siblings), so it needs the same cargo auth + engine-pinned siblings as the
      # conformance job.
      - uses: ./.github/actions/setup-engine-build
        with:
          token: ${{ secrets.VECTORS_TOKEN }}
      - run: flutter pub get
      - run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - run: flutter_rust_bridge_codegen generate
      - name: fail if generated bindings drift from the committed ones
        # Exclude the `vectors` submodule: it is never an FRB codegen output, and
        # the persistent self-hosted runner can leave it at a prior commit (this
        # job checks out without submodules), which a repo-wide diff would
        # misreport as generated-binding drift.
        run: git diff --exit-code -- . ':(exclude)vectors'
